stages:
  - validate
  - plan
  - apply

variables:
  TF_DIR: terraform
  AWS_DEFAULT_REGION: eu-west-1

default:
  image: hashicorp/terraform:1.9

.terraform_init: &terraform_init
  before_script:
    - cd ${TF_DIR}
    - terraform init -backend=false

terraform:validate:
  stage: validate
  <<: *terraform_init
  script:
    - terraform fmt -check -recursive
    - terraform validate
  rules:
    - if: '$CI_PIPELINE_SOU
    - if: '$CI_COMMIT_BRANCH == "main"'

terraform:plan:
  stage: plan
  before_script:
    - cd ${TF_DIR}
    - terraform init
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANC

terraform:apply:
  stage: apply
  before_script:
    - cd ${TF_DIR}
    - terraform init
  script:
    - terraform apply -auto
  dependencies:
    - terraform:plan
  rules:
    - if: '$CI_COMMIT_BRANC
      when: manual
  environment:
    name: production
