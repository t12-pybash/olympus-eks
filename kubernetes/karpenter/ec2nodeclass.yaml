apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiFamily: AL2
  amiSelectorTerms:
    - alias: al2@latest
  role: olympus-eks-eks-node
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: olympus-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: olympus-eks
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        deleteOnTermination: true
  tags:
    Name: olympus-eks-gpu-node
    Project: olympus-eks
