apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: nvidia-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvidia-device-plugin
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: sy
      containers:
        - name: nvidia-devi
          image: nvcr.io/nvidia/k8s-device-plugin:v0.16.2
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false
          securityContext:
            allowPrivilegeE
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
      nodeSelector:
        role: gpu
