apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: monitoring
  labels:
    app: dcgm-exporter
spec:
  selector:
    matchLabels:
      app: dcgm-exporter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dcgm-exporter
    spec:
      # Only schedule on GPU nodes provisioned by the gpu-small NodePool.
      # On a Karpenter cluster this means the DaemonSet pod provisions and
      # deprovisions alongside the GPU node — zero idle cost.
      nodeSelector:
        role: gpu-small
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s-dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
          args:
            - --collectors=/etc/dcgm-exporter/dcgm-metrics.csv
            - --address=:9400
          ports:
            - name: metrics
              containerPort: 9400
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              add: ["SYS_ADMIN"]
          volumeMounts:
            - name: dcgm-config
              mountPath: /etc/dcgm-exporter
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: dcgm-config
          configMap:
            name: dcgm-exporter-config
